[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privmotion"
version = "0.1.0"
description = "Lightweight privacy-preserving kinematic analytics prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "cryptography>=43",
  "numpy>=1.24",
  "Pillow>=10",
  "imageio[ffmpeg]>=2.37",
  "opencv-python>=4.8; python_version < '3.14'",
]

[project.optional-dependencies]
pose = [
  "ultralytics>=8.4",
]
test = [
  "pytest>=8",
]

[project.scripts]
privmotion-process = "privmotion.cli.process:main"
privmotion-validate = "privmotion.cli.validate:main"
privmotion-benchmark = "privmotion.cli.benchmark:main"
privmotion-visualize = "privmotion.cli.visualize:main"
privmotion-dataset-eval = "privmotion.cli.dataset_eval:main"
privmotion-recovery-inspect = "privmotion.cli.recovery_inspect:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
